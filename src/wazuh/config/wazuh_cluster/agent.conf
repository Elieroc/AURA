<agent_config>

  <!-- ====================================================================
       FIM (syscheck) — deux doctrines cohabitent dans ce bloc, ne pas les
       mélanger en éditant.

       A. DÉCEPTION / ransomware (règles 100670-100672) : on ne surveille PAS
          /home, /srv, /var/www, /root en entier. Un burst FIM sur des données
          utilisateur produit des faux positifs garantis (rsync, apt, git clone,
          décompression, jobs de build). L'attribut `restrict` fait que Wazuh ne
          pose des watches inotify QUE sur les fichiers dont le chemin matche le
          motif — quelques watches par arborescence au lieu de milliers, volume
          d'événements proche de zéro en fonctionnement normal.

       B. PERSISTANCE / intégrité système (règles 100740+) : chemins étroits et
          intrinsèquement sensibles (cron, unit systemd, sudoers, passwd,
          ld.so.preload). Là, PAS de `restrict` : on veut tout le répertoire,
          parce que le nom du fichier déposé par l'attaquant est imprévisible.
          Le volume reste nul parce que le périmètre est nul en temps normal.

       Le motif `restrict` est un pré-filtre grossier (syntaxe sregex OSSEC,
       volontairement limitée à des sous-chaînes littérales pour éviter tout
       piège d'échappement) ; la précision est portée par les règles locales,
       qui elles utilisent du PCRE2 fiable.

       PIÈGE : un seul bloc <directories> par chemin. Wazuh ne conserve qu'une
       entrée par répertoire — deux blocs sur /home feraient perdre le premier
       motif. Pour surveiller un fichier de plus sous /home, on AJOUTE au
       `restrict` existant, on ne crée pas un second bloc.
       ==================================================================== -->
  <syscheck>
    <alert_new_files>yes</alert_new_files>

    <!-- === A. Déception ransomware + (ajout) clés SSH sous /home ===
         `authorized_keys` est glissé dans le `restrict` du bloc /home existant
         plutôt que dans un bloc dédié, à cause du piège ci-dessus. Couvre
         /home/<user>/.ssh/authorized_keys (T1098.004) avec recursion_level=4. -->
    <directories realtime="yes" check_all="yes" recursion_level="4"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|authorized_keys|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/home</directories>

    <directories realtime="yes" check_all="yes" recursion_level="4"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/srv</directories>

    <!-- /var/www : déception ransomware + (ajout) dépôt de web shell.
         Les extensions de script exécutables par le serveur web sont ajoutées au
         `restrict` : sur cet hôte (Apache servant du statique) l'apparition d'un
         .php/.phtml/.cgi dans la racine web est le signal de web shell que la
         règle d'URL 100701 rate quand le fichier n'est pas dans /uploads (T1505.003). -->
    <directories realtime="yes" check_all="yes" recursion_level="4" report_changes="yes"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|.php|.phtml|.phar|.cgi|.pl|.py|.sh|.jsp|.asp|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/var/www</directories>

    <!-- /root : déception + clé SSH de root (recursion_level=2 suffit :
         /root/.ssh/authorized_keys est à la profondeur 2). -->
    <directories realtime="yes" check_all="yes" recursion_level="2"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|authorized_keys|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/root</directories>

    <!-- === B. Persistance / intégrité système ===
         L'ossec.conf de l'agent surveille déjà /etc, mais en mode PLANIFIÉ
         (scan périodique) : une tâche cron déposée puis retirée entre deux scans
         est invisible, et l'alerte arrive avec des heures de retard. Ces blocs
         plus spécifiques repassent ces chemins en `realtime`. Wazuh applique
         l'entrée la plus spécifique pour un sous-arbre donné.

         `report_changes="yes"` est ce qui produit le champ `content_changes`,
         indispensable pour distinguer un ajout de second UID 0 dans
         /etc/passwd d'une modification banale (règle 100743). -->

    <!-- Tâches planifiées — T1053.003 -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/crontab,/etc/cron.allow,/etc/cron.deny</directories>
    <directories realtime="yes" check_all="yes" recursion_level="2" report_changes="yes">/var/spool/cron</directories>

    <!-- Services et timers systemd — T1543.002 / T1053.006 -->
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="2">/etc/systemd/system</directories>
    <directories realtime="yes" check_all="yes" recursion_level="2">/lib/systemd/system</directories>

    <!-- Comptes, groupes, sudo — T1136 / T1548.003 / T1098
         PAS de report_changes sur shadow/gshadow : le diff serait stocké en clair
         dans la base du manager et remonterait dans les alertes, donc dans le
         contexte envoyé au LLM. Les hashes de mots de passe ne doivent pas
         quitter l'hôte. On garde donc la seule détection de modification. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/passwd,/etc/group</directories>
    <directories realtime="yes" check_all="yes">/etc/shadow,/etc/gshadow</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="1">/etc/sudoers.d</directories>

    <!-- Détournement du chargeur dynamique — T1574.006
         /etc/ld.so.preload n'existe pas sur un Debian sain : sa simple CRÉATION
         est l'alerte (alert_new_files=yes ci-dessus). -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ld.so.preload</directories>
    <directories realtime="yes" check_all="yes" recursion_level="1">/etc/ld.so.conf.d</directories>

    <!-- Authentification PAM et configuration SSH — T1556.003 / T1098.004 -->
    <directories realtime="yes" check_all="yes" recursion_level="1">/etc/pam.d</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes" recursion_level="2">/etc/ssh</directories>

    <!-- Persistance par shell d'initialisation — T1546.004 -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/profile,/etc/bash.bashrc</directories>
    <directories realtime="yes" check_all="yes" recursion_level="1">/etc/profile.d</directories>

    <!-- Bruit connu : ces fichiers sont réécrits par les mécanismes normaux du
         système (dpkg, systemd, gestion de comptes) et n'ont pas de valeur de
         détection propre. -->
    <ignore>/etc/passwd-</ignore>
    <ignore>/etc/group-</ignore>
    <ignore>/etc/shadow-</ignore>
    <ignore>/etc/gshadow-</ignore>
    <ignore>/etc/systemd/system/multi-user.target.wants</ignore>
    <ignore type="sregex">.swp$</ignore>
    <ignore type="sregex">.dpkg-new$</ignore>
    <ignore type="sregex">.dpkg-tmp$</ignore>
  </syscheck>

  <!-- ====================================================================
       Heartbeat de l'audit noyau — règles 100800-100802.

       Pourquoi : le 2026-07-26, `enabled 0` a été posé sur debian-vm. auditd
       tournait toujours, le service était `active`, l'agent Wazuh était
       connecté, /var/log/audit/audit.log existait — et le noyau n'émettait plus
       rien. 19 des 24 règles locales de niveau >= 12 dépendent de `if_group
       audit` : elles ont été aveugles 2 h, sans la moindre alerte. Une coupure
       de capteur est indétectable par une règle de corrélation, qui ne raisonne
       que sur des événements PRÉSENTS.

       La seule détection fiable d'une absence est un signal positif périodique.
       On fait donc remonter l'état d'auditd comme un log, et une règle alerte
       sur la VALEUR (enabled=0, ou zéro règle chargée) — pas sur le silence.

       Nécessite `logcollector.remote_commands=1` dans le
       local_internal_options.conf de l'agent : sans lui, Wazuh ignore
       silencieusement toute commande venant d'une configuration distante
       (posé par scripts/install-agent.sh).

       Fréquence 300 s : aligné sur le cycle du soc-agent, donc au pire une
       coupure de capteur est signalée en ~5 min au lieu de jamais.
       ==================================================================== -->
  <localfile>
    <log_format>full_command</log_format>
    <command>echo "audit_enabled=$(auditctl -s 2>/dev/null | awk '/^enabled/{print $2}') audit_rules=$(auditctl -l 2>/dev/null | grep -c .)"</command>
    <alias>audit-status</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Compte rendu des active responses.

       Le canal d'AR de Wazuh est fire-and-forget : l'API rend la main dès que
       la commande est en file, le code de retour du script ne remonte jamais.
       Sans cette remontée, `mitigations.statut` ne veut dire que « l'API a
       accepté », et le rapport IRIS du 2026-08-02 annonçait 26 quarantaines
       réussies sur un DC là où le script avait tout refusé.

       Les scripts d'AR écrivent une ligne `ar-result:` à format fixe à chaque
       sortie ; décodeur `ar-result`, règles 100930-100935, exploitées par
       `soc_agent.reconcile`. Volume : une ligne par action de remédiation, donc
       proche de zéro en régime normal.

       Le chemin est celui des agents Linux, et le bloc est restreint à eux par
       `os="Linux"` : sans ce filtre, les agents Windows héritaient du chemin
       POSIX et leur logcollector répétait à chaque démarrage
       « ERROR: (1103): Could not open file '/var/ossec/logs/active-responses.log' ».
       Sur Windows le log vit sous `active-response\active-responses.log` du
       dossier d'installation, et sa localfile est posée par
       Install-WazuhAgent-Windows.ps1. -->
</agent_config>

<agent_config os="Linux">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>
</agent_config>
