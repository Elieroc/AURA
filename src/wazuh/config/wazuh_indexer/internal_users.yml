---
# Base d'utilisateurs internes de l'indexer.
#
# Les hachages sont du bcrypt. NE PAS les écrire à la main : utiliser
#     python3 scripts/set-indexer-password.py <utilisateur>
# qui lit le mot de passe dans le .env racine et pose le hachage ici. Le
# fichier et le .env doivent rester cohérents — un hachage qui ne correspond
# plus au mot de passe se manifeste par un dashboard qui n'affiche plus rien,
# sans message clair.
#
# Ce fichier ne contient QUE les comptes réellement utilisés par le stack :
#
#   admin        - INDEXER_PASSWORD. Utilisé par le manager (filebeat), le
#                  dashboard et le soc-agent.
#   kibanaserver - DASHBOARD_PASSWORD. Compte de service du dashboard.
#
# Les comptes de démonstration livrés par OpenSearch (kibanaro, logstash,
# readall, snapshotrestore) ont été RETIRÉS. Aucun composant d'AURA ne les
# utilisait, et ils conservaient les hachages de démonstration d'upstream :
# leurs mots de passe sont publiquement documentés et identiques au nom du
# compte. Deux d'entre eux portaient le backend role `readall`, c'est-à-dire la
# lecture de tous les index — donc de toutes les alertes du parc. Ne pas les
# réintroduire ; un besoin de lecture seule se traite par un compte dédié avec
# son propre secret.

_meta:
  type: "internalusers"
  config_version: 2

admin:
  hash: "__HASH_ADMIN__"
  reserved: true
  backend_roles:
  - "admin"
  description: "Compte admin de l'indexer (hachage bcrypt de INDEXER_PASSWORD)"

kibanaserver:
  hash: "__HASH_KIBANASERVER__"
  reserved: true
  description: "Compte de service du dashboard (hachage bcrypt de DASHBOARD_PASSWORD)"
