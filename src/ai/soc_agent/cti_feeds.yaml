# Aura-SOC CTI catalog — single source of truth.
#
# Two families, handled differently BECAUSE THEY ARE NOT THE SAME NATURE:
#
#   misp_feeds: CURATED intelligence (a few thousand IOCs, contextualized,
#     attached to an event, a campaign, an actor). Ingested into MISP as
#     events, so correlatable, taggable, browsable. These are what justify
#     a level >= 12: a matching CERT-FR IOC is an incident, not a statistic.
#
#   blocklists: BULK reputation (100,000 to 300,000 IPs, no context,
#     rotating). They do NOT go through the MISP database: rewriting
#     300,000 attributes every six hours in MariaDB would wreck the
#     instance for zero analytical gain — none of these IOCs carry an
#     event to correlate. They are pulled directly by cti.py into the
#     lookup cache, and declared to MISP as `cache_only` (Redis cache) to
#     stay queryable from the UI. They match at level 10: outside the
#     incident pipeline (MIN_LEVEL=12), visible on the dashboard. A scanner
#     IP hitting an exposed SSH port is not an incident, it's internet
#     background noise.
#
# Verified reachable on 2026-08-12. A dead feed doesn't raise an error: it
# produces CTI that silently ages — hence cti.py's freshness check and
# rule 100956.

misp_feeds:
  # --- Requested: CERT-FR's public feed (TLP:CLEAR). Low volume, very
  # targeted, and the only feed in this list that covers campaigns aimed
  # specifically at French organizations.
  - name: CERT-FR OSINT
    url: https://misp.cert.ssi.gouv.fr/feed-misp/
    provider: CERT-FR / ANSSI
    format: misp
    active: true
    tags: [cti:certfr, tlp:clear]

  # --- MISP's historic OSINT feed, maintained by CIRCL. The de facto
  # reference: APT reports, campaigns, malware, with context.
  - name: CIRCL OSINT Feed
    url: https://www.circl.lu/doc/misp/feed-osint/
    provider: CIRCL
    format: misp
    active: true
    tags: [cti:circl, tlp:clear]

  # --- Botvrij.eu: IOCs extracted from public reports, low false-positive
  # rate, complements CIRCL (only partial overlap).
  - name: Botvrij.eu OSINT
    url: https://www.botvrij.eu/data/feed-osint/
    provider: Botvrij.eu
    format: misp
    active: true
    tags: [cti:botvrij, tlp:clear]

  # --- ThreatFox (abuse.ch): active C2 IOCs, with the malware family. The
  # most useful of the "hot" feeds: a match here means "this machine is
  # talking to a known C2", i.e. already compromised.
  - name: ThreatFox (abuse.ch)
    url: https://threatfox.abuse.ch/downloads/misp/
    provider: abuse.ch
    format: misp
    active: true
    tags: [cti:threatfox, malware:c2]

  # --- URLhaus (abuse.ch): malware distribution URLs. A match on a URL
  # seen in a proxy/web log = payload download.
  - name: URLhaus (abuse.ch)
    url: https://urlhaus.abuse.ch/downloads/misp/
    provider: abuse.ch
    format: misp
    active: true
    tags: [cti:urlhaus, malware:distribution]

blocklists:
  # --- Requested: Data-Shield IPv4 (duggytuxy). 15-day sliding window,
  # refreshed every 6h. Two sets:
  #   prod_*          -> scanners/attackers targeting web apps
  #   prod_critical_* -> targeting DMZ, API and exposed infra
  # The `prod_data-shield_*.txt` and `prod_critical_data-shield_*.txt`
  # files are the full lists (~100,000 IPs each); the aa/ab/ac variants
  # are the same data split into 30,000-entry chunks for firewalls with a
  # size cap. We use the full lists: no splitting needed here.
  - name: data-shield
    provider: duggytuxy
    type: ip
    urls:
      - https://raw.githubusercontent.com/duggytuxy/Data-Shield_IPv4_Blocklist/main/prod_data-shield_ipv4_blocklist.txt
      - https://raw.githubusercontent.com/duggytuxy/Data-Shield_IPv4_Blocklist/main/prod_critical_data-shield_ipv4_blocklist.txt
    category: Network activity
    comment: Scanner or attacker seen against web targets and exposed infrastructure
    tags: [cti:data-shield, reputation:scanner]

  # --- blocklist.de: IPs that attacked a sensor in the worldwide fail2ban
  # network (SSH, mail, web). Overlaps partly with data-shield, but with a
  # shorter window: good freshness signal.
  - name: blocklist.de
    provider: blocklist.de
    type: ip
    urls: [https://lists.blocklist.de/lists/all.txt]
    category: Network activity
    comment: IP that attacked a fail2ban sensor (SSH, mail, web)
    tags: [cti:blocklist-de, reputation:bruteforce]

  # --- CINS Army (Sentinel IPS): IPs with bad reputation confirmed by
  # multiple sensors, high confidence threshold, low noise.
  - name: cins-army
    provider: CINS Score
    type: ip
    urls: [https://cinsscore.com/list/ci-badguys.txt]
    category: Network activity
    comment: Bad reputation confirmed by multiple sensors (CINS)
    tags: [cti:cins, reputation:malicious]

  # --- Tor exit nodes. Do NOT confuse with malicious activity: this is a
  # provenance attribute. Deliberately falls back to level 5 (rule
  # 100954) — useful during investigation, useless as an alert.
  - name: tor-exit
    provider: Tor Project
    type: ip
    urls: [https://check.torproject.org/torbulkexitlist]
    category: Network activity
    comment: Tor exit node (provenance, not maliciousness)
    tags: [cti:tor, anonymizer:tor]

  # --- OpenPhish (free feed): active phishing URLs. Moderate volume, fast
  # rotation.
  - name: openphish
    provider: OpenPhish
    type: url
    urls: [https://openphish.com/feed.txt]
    category: Payload delivery
    comment: Active phishing URL (OpenPhish community feed)
    tags: [cti:openphish, phishing]

#   articles: UNSTRUCTURED intelligence (security press and blogs). The
#     IOCs are in the prose, often "defanged", with no common format. A
#     deterministic stage finds candidates, the LLM decides which are
#     genuine threat indicators, and the result is published as a MISP
#     EVENT tagged `aura:source:extracted` -> rule 100957, level 12. See
#     cti_articles.py. Neither curated (automatic extraction, media with
#     no CERT mandate) nor bulk (the described threat is real and
#     contextualized).

articles:
  # --- General security press. High volume, few IOCs per article: most
  # posts describe no infrastructure and so come back empty. This is the
  # NORMAL regime for these two sources, not a malfunction — the yield
  # comes from the few articles that publish an "Indicators of
  # Compromise" section.
  - name: thehackernews
    url: https://feeds.feedburner.com/TheHackersNews
    type: rss
    active: true

  - name: bleepingcomputer
    url: https://www.bleepingcomputer.com/feed/
    type: rss
    active: true

  # --- RST Cloud publishes threat-watch reports with explicit IOC lists,
  # and Medium delivers the FULL CONTENT in the feed: no page to
  # download, and the highest yield of the four sources. Cap raised: a
  # single "RST TI Report Digest" carries 400 candidates, most of which
  # are genuine indicators — that's the format of the source, not a
  # runaway extraction. The default cap (300) would reject outright the
  # richest article of the four sources.
  - name: rst-cloud
    url: https://medium.com/feed/@rst_cloud
    type: rss
    active: true
    max_iocs: 450

  # --- Malpedia: its bibliography (`/api/get/references`) is a directory
  # mapping reports to malware families and actors. The IOCs themselves
  # are NOT accessible without an API key (`/api/list/samples` returns
  # 403), but this directory brings two things no other source gives: a
  # queue of technical reports (not press), and the ATTRIBUTION made by
  # researchers, passed to the model as context.
  #
  # There is neither a date nor a "what's new" feed: the cursor of
  # already-seen URLs stands in for it. Hence the MANDATORY BOOTSTRAP on
  # first run (`--bootstrap`), which marks the tens of thousands of
  # existing entries as seen without processing them. Without it, the
  # first pass would try to make the model read the entire literature of
  # the field.
  - name: malpedia
    url: https://malpedia.caad.fkie.fraunhofer.de/api/get/references
    type: malpedia_references
    active: true

# --- Deliberately left out, so it doesn't look like an omission ---
#
# firehol_level1 / Spamhaus DROP: excellent, but published as CIDR. The
#   lookup cache does an exact match on the value, it can't say "this IP
#   is within this /24". Including them would give a loaded list that
#   never matches — worse than absent. Their place is a Wazuh CDB list
#   (`lookup="address_match_key"`, which handles CIDR): see docs/CTI.md.
#
# Feodo Tracker: the blocklist hasn't moved since 2026-03-04 (verified on
#   2026-08-12). A frozen feed gives a false sense of coverage.
#
# DigitalSide Threat-Intel: unreachable as of 2026-08-12.
