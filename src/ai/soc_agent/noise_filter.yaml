# Noise filtering before correlation and triage.
#
# Idea taken from majiinB/Wazuh-AI-Integration (config/exclude_in_query.yaml),
# adapted to our pull pipeline. Two levels, that's the whole point:
#
#   query_level: true   -> the alert is dropped BEFORE ingestion, via a
#                          must_not in the indexer query. It never enters
#                          the database. For certain, high-volume noise.
#   query_level: false  -> the alert is ingested and KEPT (audit), but
#                          marked suppressed and excluded from correlation.
#                          For what we want to be able to re-read in case
#                          of doubt.
#
# Caution rule: query_level: true only when we're sure the alert has no
# value, never otherwise. When in doubt, false — we keep the trace.
#
# This file is a STARTING POINT. Recurring false positives are discovered
# in operation (and soon via whitelist clustering). Keep it up to date,
# with a `reason` on each line for the audit trail.

version: 1

filters:

  # By Wazuh rule ID.
  rules:
    ignore_rule_ids:
      # 242,409 events in 24h for this one alone, i.e. 99.6% of
      # wazuh-proxy-*. nginx-proxy-manager exposes the whole lab to the
      # internet: its access log is a continuous stream of untargeted
      # scanning, and a 400 means precisely that nothing was served.
      # Dropped BEFORE ingestion, otherwise adding wazuh-proxy-* to the
      # indices read would bring a quarter million lines a day into the
      # database.
      # The useful signal from these events isn't lost: rule 100823
      # (12 4xx errors in 60s from the same IP -> level 10, probable
      # scan) is aggregated ON THE MANAGER SIDE, i.e. upstream of this
      # filter, and it is ingested normally.
      - id: "31101"
        reason: "Erreur 4xx du serveur web — bruit de scan internet sur le reverse proxy, agrégé par 100823"
        query_level: true

  # By source account (data.srcuser).
  actors:
    ignore_src_users:
      - user: "_apt"
        query_level: true
        reason: "Gestionnaire de paquets APT — activité système normale"
      - user: "nobody"
        query_level: true
        reason: "Compte de service anonyme"
      - user: "syslog"
        query_level: true
        reason: "Démon de journalisation"

  # By target account (data.dstuser).
  destinations:
    ignore_dst_users:
      - user: "messagebus"
        query_level: true
        reason: "Bus système D-Bus"

  # By command (data.command).
  commands:
    ignore_commands: []

  # By host. Do NOT fill in lightly: excluding an agent blinds the SOC on
  # that machine. Reserved for test hosts.
  hosts:
    ignore_agent_names: []
    ignore_agent_ids: []

  # Composite filters: all conditions must match the same alert. Always
  # post-retrieval (query_level: false) — too specific for a must_not,
  # and this is exactly the kind of suppression we want to be able to
  # re-read.
  composite:
    - name: "apt_daily_root"
      description: "Maintenance quotidienne d'APT lancée par root"
      match_all:
        src_user: "root"
        command: "/usr/lib/apt/apt.systemd.daily"
