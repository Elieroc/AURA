# Filtrage du bruit avant corrélation et triage.
#
# Idée reprise de majiinB/Wazuh-AI-Integration (config/exclude_in_query.yaml),
# adaptée à notre pipeline en pull. Deux niveaux, c'est tout l'intérêt :
#
#   query_level: true   -> l'alerte est écartée AVANT l'ingestion, via un
#                          must_not dans la requête à l'indexer. Elle n'entre
#                          jamais en base. Pour le bruit certain et volumineux.
#   query_level: false  -> l'alerte est ingérée et CONSERVÉE (audit), mais
#                          marquée suppressed et exclue de la corrélation. Pour
#                          ce qu'on veut pouvoir relire en cas de doute.
#
# Régle de prudence : query_level: true seulement quand on est sûr que l'alerte
# n'a aucune valeur, jamais. Dans le doute, false — on garde la trace.
#
# Ce fichier est un POINT DE DÉPART. Les faux positifs récurrents se
# découvrent en exploitation (et bientôt via le clustering de whitelist). À
# tenir à jour, avec un `reason` sur chaque ligne pour l'audit.

version: 1

filters:

  # Par identifiant de règle Wazuh.
  rules:
    ignore_rule_ids:
      # 242 409 événements en 24 h à elle seule, soit 99,6 % de wazuh-proxy-*.
      # nginx-proxy-manager expose tout le lab sur internet : son access log est
      # un flux continu de scan non ciblé, et un 400 signifie précisément que
      # rien n'a été servi. Écartée AVANT ingestion, sinon l'ajout de
      # wazuh-proxy-* aux indices lus fait entrer un quart de million de lignes
      # par jour en base.
      # Le signal utile de ces événements n'est pas perdu : la règle 100823
      # (12 erreurs 4xx en 60 s depuis la même IP -> niveau 10, scan probable)
      # est agrégée CÔTÉ MANAGER, donc en amont de ce filtre, et elle est
      # ingérée normalement.
      - id: "31101"
        reason: "Erreur 4xx du serveur web — bruit de scan internet sur le reverse proxy, agrégé par 100823"
        query_level: true

  # Par compte source (data.srcuser).
  actors:
    ignore_src_users:
      - user: "_apt"
        query_level: true
        reason: "Gestionnaire de paquets APT — activité système normale"
      - user: "nobody"
        query_level: true
        reason: "Compte de service anonyme"
      - user: "syslog"
        query_level: true
        reason: "Démon de journalisation"

  # Par compte cible (data.dstuser).
  destinations:
    ignore_dst_users:
      - user: "messagebus"
        query_level: true
        reason: "Bus système D-Bus"

  # Par commande (data.command).
  commands:
    ignore_commands: []

  # Par hôte. À NE PAS remplir à la légère : exclure un agent aveugle le SOC
  # sur cette machine. Réservé aux hôtes de test.
  hosts:
    ignore_agent_names: []
    ignore_agent_ids: []

  # Filtres composites : toutes les conditions doivent matcher la même alerte.
  # Toujours post-retrieval (query_level: false) — trop spécifiques pour un
  # must_not, et c'est justement le genre de suppression qu'on veut pouvoir
  # relire.
  composite:
    - name: "apt_daily_root"
      description: "Maintenance quotidienne d'APT lancée par root"
      match_all:
        src_user: "root"
        command: "/usr/lib/apt/apt.systemd.daily"
