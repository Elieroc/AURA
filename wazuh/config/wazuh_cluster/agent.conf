<agent_config>

  <!-- SOC-AI: FIM temps réel sur les répertoires temporaires world-writable, pour
       la détection heuristique "zip bomb" (fichier anormalement volumineux apparu
       soudainement après décompression) — voir règle locale 100627. -->
  <syscheck>
    <directories realtime="yes" report_changes="no" check_size="yes">/tmp</directories>
    <directories realtime="yes" report_changes="no" check_size="yes">/var/tmp</directories>
    <directories realtime="yes" report_changes="no" check_size="yes">/dev/shm</directories>
  </syscheck>

</agent_config>
