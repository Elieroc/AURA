<agent_config>

  <!-- SOC-AI — Détection ransomware par déception (règles 100670-100672).
       Voir wazuh/README.md § "Détection — ransomware".

       Principe : on NE surveille PAS /home en entier (un burst FIM sur des
       données utilisateur produit des faux positifs garantis : rsync, apt,
       git clone, décompression, jobs de build). L'attribut `restrict` fait que
       Wazuh ne pose des watches inotify QUE sur les fichiers dont le chemin
       matche le motif — donc quelques watches par arborescence au lieu de
       plusieurs milliers, et un volume d'événements proche de zéro en
       fonctionnement normal.

       Le motif `restrict` est un pré-filtre grossier (syntaxe sregex OSSEC,
       volontairement limitée à des sous-chaînes littérales pour éviter tout
       piège d'échappement) ; la précision est portée par les règles locales,
       qui elles utilisent du PCRE2 fiable.

       Deux familles de motifs :
       1. CANARY_SOC_NE_PAS_TOUCHER — fichiers leurres déposés par
          scripts/deploy-canary.sh. Rien de légitime ne les écrit.
       2. Noms de notes de rançon et extensions de chiffrement connues.

       Un seul bloc <directories> par chemin : Wazuh ne conserve qu'une entrée
       par répertoire, deux blocs sur /home feraient perdre le premier motif. -->
  <syscheck>
    <alert_new_files>yes</alert_new_files>

    <directories realtime="yes" check_all="yes" recursion_level="4"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/home</directories>

    <directories realtime="yes" check_all="yes" recursion_level="4"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/srv</directories>

    <directories realtime="yes" check_all="yes" recursion_level="4"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/var/www</directories>

    <directories realtime="yes" check_all="yes" recursion_level="2"
                 restrict="CANARY_SOC_NE_PAS_TOUCHER|_readme.txt|HOW_TO_DECRYPT|how_to_decrypt|HOW_TO_RESTORE|DECRYPT_FILES|RESTORE_FILES|RECOVER_FILES|readme_for_decrypt|locky|lockbit|djvu|wncry|wannacry|phobos|makop|mallox|blackcat|akira|nokoyawa|cryptolocker">/root</directories>
  </syscheck>

</agent_config>
