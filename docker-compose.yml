# AURA — compose racine unique. `cp .env.example .env`, éditer, puis
# `docker compose up -d` : les 4 stacks (Wazuh, soc-agent, DFIR-IRIS, Shuffle)
# démarrent ensemble. Le serveur MCP Wazuh (mcp/) reste hors dépôt et hors de
# ce fichier — déploiement séparé, voir mcp/README.md.
#
# Bases de données (Postgres soc-agent/IRIS, OpenSearch Shuffle/Wazuh) en bind
# mount vers ./db/ (gitignored) : `mkdir -p db/{socagent-postgres,iris-postgres,shuffle-opensearch,wazuh-indexer}`
# avant le premier `up`. Tout le reste (wazuh_etc, wazuh_logs, iris_downloads,
# shuffle-apps, certs...) reste en named volumes docker ou bind mounts de
# config, inchangé par rapport aux 4 anciens stacks séparés.

x-soc-agent: &soc-agent
  build:
    context: ./src/ai
    dockerfile: Dockerfile
  image: soc-agent:latest
  env_file: .env
  network_mode: host
  restart: unless-stopped
  depends_on:
    soc-agent-db:
      condition: service_healthy

services:
  # ===================== WAZUH =====================
  # Wazuh App Copyright (C) 2017, Wazuh Inc. (License GPLv2)
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    # 1514/1515/514 doivent être joignables par les agents du parc, donc publiés
    # sur toutes les interfaces — c'est leur raison d'être.
    # 55000 (API) reste publié À REGRET : les workflows Shuffle joignent l'API
    # par l'IP de l'hôte depuis le réseau docker « shuffle » (cf.
    # src/shuffle/workflows/build_workflows.py, WAZUH_HOST), un bind loopback
    # casserait l'isolation et le kill. Sa seule serrure est donc
    # WAZUH_API_PASSWORD : ce mot de passe doit être fort et distinct des
    # autres. Un pare-feu devant 55000, limité aux hôtes qui en ont besoin, est
    # la vraie réponse.
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./src/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Un fichier par règle (cf. src/wazuh/config/wazuh_cluster/rules/README.md).
      # `<rule_dir>etc/rules</rule_dir>` de wazuh_manager.conf charge tous les
      # *.xml du répertoire, par ordre alphabétique — donc par ordre
      # d'identifiant, les noms étant `<id>-…`.
      #
      # Monté DIRECTEMENT sur /var/ossec/etc/rules, et non via
      # /wazuh-config-mount : le mécanisme config-mount COPIE les fichiers et
      # n'en supprime jamais. Une règle renommée ou supprimée dans le dépôt
      # survivait donc dans le volume, et le manager chargeait l'ancienne ET la
      # nouvelle — 82 règles définies deux fois, sans la moindre erreur au
      # démarrage. Le montage direct fait du dépôt la seule source de vérité.
      # Ce répertoire ne contient QUE nos règles locales ; le ruleset natif vit
      # dans /var/ossec/ruleset/rules et n'est pas concerné.
      - ./src/wazuh/config/wazuh_cluster/rules:/var/ossec/etc/rules
      - ./src/wazuh/config/wazuh_cluster/decoders:/var/ossec/etc/decoders
      - ./src/wazuh/config/wazuh_cluster/agent.conf:/wazuh-config-mount/etc/shared/default/agent.conf
      - ./src/wazuh/config/wazuh_cluster/alerts-pipeline.json:/usr/share/filebeat/module/wazuh/alerts/ingest/pipeline.json
      - ./src/wazuh/integrations/custom-abuseipdb:/var/ossec/integrations/custom-abuseipdb
      - ./src/wazuh/integrations/custom-abuseipdb.py:/var/ossec/integrations/custom-abuseipdb.py
      - ./src/wazuh/integrations/custom-misp:/var/ossec/integrations/custom-misp
      - ./src/wazuh/integrations/custom-misp.py:/var/ossec/integrations/custom-misp.py
      # Cache d'IOC produit par soc-agent-cti, en LECTURE SEULE : le manager
      # consomme du renseignement, il n'en produit pas. Le montage est un
      # volume et non un bind mount vers l'hôte parce que les deux conteneurs
      # tournent avec des uid différents et que l'écriture est atomique
      # (rename) côté producteur.
      - cti_ioc:/var/ossec/integrations/cti:ro

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    hostname: wazuh.indexer
    restart: always
    # Bind loopback : l'indexer contient TOUTES les alertes du parc, c'est-à-dire
    # la cartographie de ce que le SOC voit et de ce qu'il ne voit pas. Rien n'a
    # besoin du port publié : le manager et le dashboard joignent l'indexer par
    # le réseau docker (https://wazuh.indexer:9200), et le soc-agent par la
    # loopback (INDEXER_URL). Publier sur 0.0.0.0 exposait tout le corpus au LAN.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./db/wazuh-indexer:/var/lib/wazuh-indexer
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./src/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./src/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 443:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      # Mot de passe du compte de service du dashboard. Il était figé à
      # « kibanaserver » — le mot de passe de démonstration d'OpenSearch,
      # publiquement documenté. Il vient maintenant du .env, et le hachage
      # correspondant est posé dans internal_users.yml par
      # scripts/set-indexer-password.py (les deux doivent être régénérés
      # ensemble, sinon le dashboard ne s'authentifie plus).
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./src/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./src/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./src/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  # ===================== SOC-AGENT (ai/) =====================
  # Base séparée de celle d'IRIS volontairement : IRIS applique ses propres
  # migrations de schéma au démarrage et monte de version à son rythme.
  # Partager l'instance reviendrait à lier nos migrations aux siennes.
  #
  # Pas de Redis à ce stade. La file avait du sens avec un ingest poussé par
  # Wazuh ; on tire depuis l'indexer, donc le curseur en base joue déjà le rôle
  # de tampon et rien ne se perd si le soc-agent est arrêté. Redis reviendra
  # quand il y aura plusieurs workers à alimenter.
  #
  # Jobs périodiques (cycle/reconcile/whitelist-task) : un conteneur par job,
  # boucle shell (`while true; do ...; sleep N; done`) — remplace les anciens
  # timers systemd utilisateur, même cadence, même verrou consultatif Postgres
  # anti-chevauchement (déjà dans chaque module). network_mode: host car
  # Postgres/indexer Wazuh/API Wazuh/IRIS/Shuffle sont tous publiés sur la
  # loopback de l'hôte — évite de rejoindre les réseaux docker des autres
  # services et de réécrire .env.
  soc-agent-db:
    image: postgres:16-alpine
    container_name: socagent-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PGUSER:-socagent}
      - POSTGRES_PASSWORD=${PGPASSWORD:?PGPASSWORD requis, cf. .env.example}
      - POSTGRES_DB=${PGDATABASE:-socagent}
    # 5433 : 5432 reste libre pour un usage local, et on évite toute confusion
    # avec la base d'IRIS.
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    mem_limit: 512m
    volumes:
      - ./db/socagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-socagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ingest -> correlate -> triage -> whitelist auto -> cases IRIS, en une
  # exécution. Cadence identique à l'ancien soc-agent-cycle.timer (5 min).
  soc-agent-cycle:
    <<: *soc-agent
    container_name: soc-agent-cycle
    command: sh -c "while true; do python -m soc_agent.cycle; sleep 300; done"

  # Surveillance continue des capteurs. Un capteur muet est un angle mort du SOC
  # lui-même : aucune règle ne peut le détecter, seul un contrôle périodique le
  # voit. Cadence 2 min, indépendante du cycle de triage (5 min) : avec un seuil
  # de panne à 10 min, la détection tombe au pire à 12 min du dernier événement.
  # Ouvre un case IRIS par panne, le referme quand le capteur réémet.
  soc-agent-watchdog:
    <<: *soc-agent
    container_name: soc-agent-watchdog
    command: >
      sh -c "while true; do python -m soc_agent.watchdog --surveiller; sleep 120; done"

  # Défait les remédiations dont la tâche IRIS est passée en 'Canceled'.
  # Cadence courte (1 min, comme l'ancien soc-agent-reconcile.timer) : une
  # désisolation/déblocage demandée par l'analyste doit être réactive.
  soc-agent-reconcile:
    <<: *soc-agent
    container_name: soc-agent-reconcile
    command: >
      sh -c "while true; do python -m soc_agent.mitigate --reconcilier; sleep 60; done"

  # Traite les tâches IRIS WHITELIST passées en 'To do'. Même cadence courte
  # que reconcile (ancien soc-agent-whitelist-task.timer).
  soc-agent-whitelist-task:
    <<: *soc-agent
    container_name: soc-agent-whitelist-task
    command: sh -c "while true; do python -m soc_agent.whitelist_task; sleep 60; done"

  # Mode training : apprend le bruit ambiant du SI avant de laisser le SOC
  # juger et remédier (cf. training.py). Ouvre sa fenêtre au tout premier
  # lancement si TRAINING_ENABLED, apprend pendant TRAINING_DAYS jours, clôture
  # par un case IRIS « TRAINING », puis RESTE EN VIE : c'est lui qui écoute les
  # tâches de ce case passées en 'Canceled' pour désactiver l'exception
  # correspondante. Cadence 5 min, alignée sur le cycle.
  #
  # Les variables viennent directement du .env racine, lu par `docker compose
  # up -d` — pas de wrapper intermédiaire.
  soc-training:
    <<: *soc-agent
    container_name: soc-training
    environment:
      - TRAINING_ENABLED=${TRAINING_ENABLED:-false}
      - TRAINING_DAYS=${TRAINING_DAYS:-7}
      - TRAINING_MIN_LEVEL=${TRAINING_MIN_LEVEL:-12}
      - TRAINING_MAX_LEVEL=${TRAINING_MAX_LEVEL:-15}
    command: sh -c "while true; do python -m soc_agent.training --tick; sleep 300; done"

  # Exporte les métriques d'utilisation du modèle vers l'index wazuh-ai-*
  # (cf. metrics.py). Cadence 5 min, alignée sur le cycle : chaque passage
  # réexporte une fenêtre glissante, l'export étant idempotent.
  soc-agent-metrics:
    <<: *soc-agent
    container_name: soc-agent-metrics
    command: sh -c "while true; do python -m soc_agent.metrics; sleep 300; done"

  # VOC : tient le journal des vulnérabilités du parc et alimente le dashboard
  # VOC (cf. vulns.py, docs/VOC.md). L'index d'état de Wazuh
  # (wazuh-states-vulnerabilities-*) supprime le document d'une vulnérabilité
  # corrigée — sans ce job, aucun historique, donc ni burn-down, ni MTTR, ni
  # suivi de SLA.
  #
  # Cadence HORAIRE : syscollector inventorie toutes les heures et le feed CTI
  # est rafraîchi toutes les heures (feed-update-interval). Scanner plus souvent
  # ne ferait que relire la même chose — la dette de vulnérabilités bouge à la
  # journée, pas à la minute.
  soc-agent-vulns:
    <<: *soc-agent
    container_name: soc-agent-vulns
    command: sh -c "while true; do python -m soc_agent.vulns; sleep 3600; done"

  # Génère des règles Wazuh d'exception à partir des FP récurrents, pour que le
  # bruit soit écarté DANS le moteur de règles et non après coup par le
  # soc-agent (cf. rule_tuning.py). Seul job à écrire dans le répertoire de
  # règles du manager, d'où le montage — le même chemin hôte que celui monté
  # sur /var/ossec/etc/rules par wazuh.manager.
  #
  # Cadence HORAIRE et non à la minute : charger un changement de règle exige
  # un redémarrage du manager. Il n'y a rien d'urgent à calmer une règle.
  soc-agent-rule-tuning:
    <<: *soc-agent
    container_name: soc-agent-rule-tuning
    volumes:
      - ${WAZUH_RULES_DIR:-./src/wazuh/config/wazuh_cluster/rules}:/wazuh-rules
    command: sh -c "while true; do python -m soc_agent.rule_tuning; sleep 3600; done"

  # Serveur MCP AURA : un seul endpoint pour piloter le SOC depuis un client IA
  # (Claude Code, Claude Desktop, tout client MCP). Voir docs/MCP.md.
  #
  # Image distincte de soc-agent:latest — même code soc_agent embarqué, mais des
  # dépendances en plus (SDK MCP, uvicorn, PyJWT) qu'il n'y a aucune raison de
  # traîner dans les six conteneurs du pipeline. Contexte de build ./src pour
  # pouvoir copier ai/soc_agent ET mcp/aura_mcp.
  #
  # network_mode: host, donc pas de `ports:` : c'est le serveur lui-même qui
  # n'écoute que sur AURA_MCP_HOST (127.0.0.1 par défaut). L'exposer sur le LAN
  # donnerait à qui atteint le port les droits d'isolation d'hôte du SOC.
  aura-mcp:
    build:
      context: ./src
      dockerfile: mcp/Dockerfile
    image: aura-mcp:latest
    container_name: aura-mcp
    env_file: .env
    network_mode: host
    restart: unless-stopped
    depends_on:
      soc-agent-db:
        condition: service_healthy
    environment:
      # Racine du dépôt vue depuis le conteneur : l'enrôlement d'agent exécute
      # les recettes versionnées (install-agent.sh, la recette Windows, les
      # scripts d'active response) au lieu d'en recopier le contenu — une
      # divergence entre les deux resterait invisible jusqu'à l'échec muet
      # d'une remédiation sur une machine.
      AURA_DEPOT: /aura
    volumes:
      # Lecture seule : le MCP lit l'état des règles auto-générées, il ne les
      # écrit pas (rule_tuning reste le seul à écrire, depuis son conteneur).
      - ${WAZUH_RULES_DIR:-./src/wazuh/config/wazuh_cluster/rules}:/wazuh-rules:ro
      # Le dépôt, en lecture seule : recettes d'enrôlement et configuration du
      # manager (relue pour vérifier les déclarations d'active response).
      - ./:/aura:ro
      # Clé d'exploitation : etat_isolation et l'enrôlement d'agent passent
      # par ssh vers les hôtes du parc.
      - ${SSH_KEY_HOST:-/root/.ssh/wazuh_ops_ed25519}:/root/.ssh/wazuh_ops_ed25519:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,os; urllib.request.urlopen('http://%s:%s/health' % (os.environ.get('AURA_MCP_HOST','127.0.0.1'), os.environ.get('AURA_MCP_PORT','3100')))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Serveur MCP Wazuh amont (gensecaihq/Wazuh-MCP-Server, image patchée pour
  # l'active response — voir mcp/README.md, hors dépôt). Le serveur AURA le
  # relaie : les clients IA n'en déclarent qu'un seul.
  #
  # Publié sur la loopback uniquement. Ses 19 outils d'active response sont
  # masqués par le relais d'AURA — mais un client qui atteindrait CE port les
  # aurait tous, sans le moindre garde-fou. D'où l'écoute locale.
  wazuh-mcp:
    image: wazuh-main-server:4.2.1
    container_name: wazuh-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAZUH_MCP_PORT:-3000}:3000"
    environment:
      MCP_HOST: 0.0.0.0
      AUTH_MODE: bearer
      AUTH_SECRET_KEY: ${WAZUH_MCP_SECRET:?WAZUH_MCP_SECRET manquant}
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      WAZUH_HOST: wazuh.manager
      WAZUH_PORT: "55000"
      WAZUH_USER: ${WAZUH_API_USER:-wazuh-wui}
      WAZUH_PASS: ${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD manquant}
      WAZUH_INDEXER_HOST: wazuh.indexer
      WAZUH_INDEXER_PORT: "9200"
      WAZUH_INDEXER_USER: ${INDEXER_USERNAME:-admin}
      WAZUH_INDEXER_PASS: ${INDEXER_PASSWORD:?INDEXER_PASSWORD manquant}
      # Certificats auto-signés sur le réseau interne du compose. Les trois
      # variables sont nécessaires : VERIFY_SSL seule ne suffit pas, le client
      # manager et le client indexer lisent chacun la leur (le serveur amont
      # journalisait « verify_ssl=True » alors que VERIFY_SSL valait false).
      VERIFY_SSL: "false"
      WAZUH_VERIFY_SSL: "false"
      WAZUH_INDEXER_VERIFY_SSL: "false"
      WAZUH_ALLOW_SELF_SIGNED: "true"
    networks:
      - default

  # ===================== DFIR-IRIS (iris/) =====================
  # UI : https://localhost:8443 (443 est déjà pris par le dashboard Wazuh).
  #
  # Images épinglées sur une release précise : IRIS applique des migrations de
  # schéma au démarrage, un `latest` qui bouge peut migrer la base sans qu'on
  # l'ait décidé. Montée de version = changement de IRIS_VERSION + relecture du
  # CHANGELOG upstream.
  iris-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iris-rabbitmq
    restart: unless-stopped
    # Aucun port publié : broker Celery interne app <-> worker uniquement.
    mem_limit: 384m
    networks:
      - iris_backend

  iris-db:
    image: ghcr.io/dfir-iris/iriswebapp_db:${IRIS_VERSION:-v2.4.27}
    container_name: iris-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_ADMIN_USER
      - POSTGRES_ADMIN_PASSWORD
      - POSTGRES_DB
    mem_limit: 512m
    volumes:
      - ./db/iris-postgres:/var/lib/postgresql/data
    networks:
      - iris_backend

  iris-app:
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION:-v2.4.27}
    container_name: iris-app
    restart: unless-stopped
    command: ["nohup", "./iris-entrypoint.sh", "iriswebapp"]
    depends_on:
      - iris-rabbitmq
      - iris-db
    env_file:
      - .env
    environment:
      # IRIS_ADM_API_KEY : nom attendu en interne par IRIS, valeur portée par
      # notre var canonique IRIS_API_KEY (fusionnée avec l'ancien IRIS_ADM_API_KEY).
      - IRIS_ADM_API_KEY=${IRIS_API_KEY:-}
    mem_limit: 1g
    volumes:
      - ./src/iris/certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
      - ./src/iris/certificates/:/home/iris/certificates/:ro
      - ./src/iris/certificates/ldap/:/iriswebapp/certificates/ldap/:ro
      - iris_downloads:/home/iris/downloads
      - user_templates:/home/iris/user_templates
      - server_data:/home/iris/server_data
    networks:
      - iris_backend
      - iris_frontend

  iris-worker:
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION:-v2.4.27}
    container_name: iris-worker
    restart: unless-stopped
    # On court-circuite ./iris-entrypoint.sh iris-worker pour appeler celery
    # nous-mêmes, uniquement afin de passer -c : sinon Celery lance un process
    # par cœur (16 ici), réclame ~780 Mo au repos et se fait OOM-kill, pour une
    # charge de quelques tâches par heure. Le CPU est la ressource rare, il ira
    # au LLM. L'entrypoint acceptait NUMBER_OF_CHILD jusqu'en v2.4.20 ; depuis,
    # celery y est câblé en dur.
    # À revérifier à chaque montée de version :
    #   docker run --rm --entrypoint cat <image> /iriswebapp/iris-entrypoint.sh
    command:
      ["./wait-for-iriswebapp.sh", "iris-app:8000",
       "celery", "-A", "app.celery", "worker",
       "-c", "${IRIS_WORKER_CONCURRENCY:-2}", "-E", "-B", "-l", "INFO"]
    depends_on:
      - iris-rabbitmq
      - iris-db
      - iris-app
    env_file:
      - .env
    environment:
      - IRIS_ADM_API_KEY=${IRIS_API_KEY:-}
    mem_limit: 512m
    volumes:
      - ./src/iris/certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
      - ./src/iris/certificates/:/home/iris/certificates/:ro
      - ./src/iris/certificates/ldap/:/iriswebapp/certificates/ldap/:ro
      - iris_downloads:/home/iris/downloads
      - user_templates:/home/iris/user_templates
      - server_data:/home/iris/server_data
    networks:
      - iris_backend

  iris-nginx:
    image: ghcr.io/dfir-iris/iriswebapp_nginx:${IRIS_VERSION:-v2.4.27}
    container_name: iris-nginx
    restart: unless-stopped
    depends_on:
      - iris-app
    environment:
      - IRIS_UPSTREAM_SERVER
      - IRIS_UPSTREAM_PORT
      - IRIS_FRONTEND_SERVER
      - IRIS_FRONTEND_PORT
      - INTERFACE_HTTPS_PORT
      - SERVER_NAME
      - CERT_FILENAME
      - KEY_FILENAME
      - IRIS_AUTHENTICATION_TYPE
    mem_limit: 128m
    # Bind loopback par défaut : IRIS contient les cases, les IOC et les
    # notes d'investigation — c'est-à-dire la cartographie de nos incidents.
    # Pour y accéder depuis le LAN, changer IRIS_BIND_ADDR dans .env et
    # remplacer le certificat auto-signé.
    ports:
      - "${IRIS_BIND_ADDR:-127.0.0.1}:${INTERFACE_HTTPS_PORT:-8443}:${INTERFACE_HTTPS_PORT:-8443}"
    volumes:
      - ./src/iris/certificates/web_certificates/:/www/certs/:ro
    networks:
      - iris_frontend

  # ===================== SHUFFLE (shuffle/) =====================
  # UI : http://localhost:3001 — API : http://localhost:5001
  # Bootstrap admin via SHUFFLE_DEFAULT_* (voir .env.example).
  #
  # Bind loopback par défaut (SHUFFLE_BIND_ADDR), comme IRIS. Ce n'est pas une
  # précaution de principe : shuffle-backend monte /var/run/docker.sock, donc
  # quiconque s'authentifie sur son API peut faire exécuter du code par le démon
  # Docker de l'hôte — c'est-à-dire devenir root SUR LE MANAGER. Publier 5001 sur
  # 0.0.0.0 mettait cette porte à portée du LAN, avec les identifiants de
  # bootstrap pour seule serrure. Pour ouvrir l'UI au LAN, changer
  # SHUFFLE_BIND_ADDR dans .env APRÈS avoir changé SHUFFLE_DEFAULT_PASSWORD et
  # SHUFFLE_DEFAULT_APIKEY.
  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    restart: unless-stopped
    ports:
      - "${SHUFFLE_BIND_ADDR:-127.0.0.1}:3001:80"
    environment:
      - BACKEND_HOSTNAME=shuffle-backend
    depends_on:
      - shuffle-backend
    networks:
      - shuffle

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    container_name: shuffle-backend
    hostname: shuffle-backend
    restart: unless-stopped
    ports:
      - "${SHUFFLE_BIND_ADDR:-127.0.0.1}:5001:5001"
    volumes:
      # Requis : le backend/orborus pilote Docker pour exécuter les apps.
      # C'est aussi ce qui fait de l'API Shuffle un chemin vers root sur l'hôte,
      # d'où le bind loopback ci-dessus.
      - /var/run/docker.sock:/var/run/docker.sock
      - shuffle-apps:/shuffle-apps
      - shuffle-files:/shuffle-files
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
      - SHUFFLE_OPENSEARCH_URL=http://shuffle-opensearch:9200
      - SHUFFLE_ELASTIC=true
      - ORG_ID=Shuffle
      - ENVIRONMENT_NAME=Shuffle
      - SHUFFLE_DEFAULT_USERNAME=${SHUFFLE_DEFAULT_USERNAME}
      - SHUFFLE_DEFAULT_PASSWORD=${SHUFFLE_DEFAULT_PASSWORD}
      - SHUFFLE_DEFAULT_APIKEY=${SHUFFLE_DEFAULT_APIKEY}
    depends_on:
      - shuffle-opensearch
    networks:
      - shuffle

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT_NAME=Shuffle
      - BASE_URL=http://shuffle-backend:5001
      - DOCKER_API_VERSION=1.40
      - SHUFFLE_ORBORUS_EXECUTION_CONCURRENCY=5
      - SHUFFLE_LOGS_DISABLED=true
      - SHUFFLE_WORKER_IMAGE=ghcr.io/shuffle/shuffle-worker:latest
      - SHUFFLE_BASE_IMAGE_REGISTRY=ghcr.io
      - CLEANUP=true
    depends_on:
      - shuffle-backend
    networks:
      - shuffle

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: shuffle-opensearch
    hostname: shuffle-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./db/shuffle-opensearch:/usr/share/opensearch/data
    networks:
      - shuffle

  # ===================== MISP (CTI) =====================
  # UI : https://127.0.0.1:8444 (MISP_BIND_ADDR / MISP_HTTPS_PORT).
  # Voir docs/CTI.md pour le rôle exact de chaque pièce.
  #
  # MISP est la MÉMOIRE du renseignement : événements, campagnes, tags,
  # corrélations. Il n'est PAS dans le chemin de détection — c'est
  # `soc-agent-cti` qui en extrait un cache d'IOC que l'intégration
  # custom-misp du manager interroge en local. Conséquence voulue : MISP peut
  # être arrêté, redémarré ou lent sans qu'une seule alerte Wazuh en pâtisse.
  #
  # Bind loopback, comme IRIS et Shuffle. Une instance MISP dit ce que le SOC
  # sait chercher — donc, en creux, ce qu'il ne cherche pas. Sa clé d'API
  # (MISP_KEY) vaut lecture ET écriture sur tout le renseignement.
  misp-db:
    image: mariadb:10.11
    container_name: misp-db
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=${MISP_INNODB_BUFFER_POOL_SIZE:-512M}
      --innodb-change-buffering=none
      --innodb-io-capacity=1000
      --innodb-log-file-size=600M
      --innodb-read-io-threads=16
      --innodb-write-io-threads=4
    environment:
      - MYSQL_DATABASE=${MISP_DB_NAME:-misp}
      - MYSQL_USER=${MISP_DB_USER:-misp}
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:?MISP_DB_PASSWORD requis, cf. .env.example}
      - MYSQL_ROOT_PASSWORD=${MISP_DB_ROOT_PASSWORD:?MISP_DB_ROOT_PASSWORD requis, cf. .env.example}
    volumes:
      - ./db/misp-mariadb:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --user=root --password=$$MYSQL_ROOT_PASSWORD status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - misp

  misp-redis:
    image: valkey/valkey:7.2
    container_name: misp-redis
    restart: unless-stopped
    command: ["--requirepass", "${MISP_REDIS_PASSWORD:?MISP_REDIS_PASSWORD requis, cf. .env.example}"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - VALKEY_PASSWORD=${MISP_REDIS_PASSWORD}
    networks:
      - misp

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:${MISP_CORE_TAG:-v2.5.44}
    container_name: misp-core
    restart: unless-stopped
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy
    environment:
      # BASE_URL doit être l'URL par laquelle on ATTEINT MISP : c'est elle que
      # MISP met dans ses liens, ses cookies et ses redirections. Un décalage
      # avec le port publié ci-dessous casse l'authentification de l'UI sans
      # message clair.
      - BASE_URL=${MISP_URL:-https://127.0.0.1:8444}
      - ADMIN_EMAIL=${MISP_ADMIN_EMAIL:-admin@aura.local}
      - ADMIN_PASSWORD=${MISP_ADMIN_PASSWORD:?MISP_ADMIN_PASSWORD requis, cf. .env.example}
      - ADMIN_ORG=${MISP_ADMIN_ORG:-AURA}
      # Clé d'API posée par nous et non tirée au sort par MISP : c'est la même
      # valeur que MISP_KEY côté soc-agent-cti. Sans ça, il faudrait aller la
      # chercher à la main dans l'UI après chaque recréation du conteneur.
      - ADMIN_KEY=${MISP_KEY:?MISP_KEY requis (40 caractères), cf. .env.example}
      - AUTOGEN_ADMIN_KEY=false
      - GPG_PASSPHRASE=${MISP_GPG_PASSPHRASE:?MISP_GPG_PASSPHRASE requis, cf. .env.example}
      - ENCRYPTION_KEY=${MISP_ENCRYPTION_KEY:?MISP_ENCRYPTION_KEY requis, cf. .env.example}
      - DISABLE_PRINTING_PLAINTEXT_CREDENTIALS=true
      - ENABLE_BACKGROUND_UPDATES=true
      - DISABLE_IPV6=true
      - CRON_USER_ID=1
      # Les feeds sont tirés par MISP toutes les heures. Le cache d'IOC de
      # Wazuh est, lui, reconstruit à la même cadence par soc-agent-cti :
      # inutile de descendre plus bas, les sources amont publient au mieux
      # toutes les 6 h (Data-Shield) ou à la journée (CERT-FR, CIRCL).
      - FETCH_FEED_INTERVAL=3600
      - CACHE_FEED_INTERVAL=3600
      - MYSQL_HOST=misp-db
      - MYSQL_USER=${MISP_DB_USER:-misp}
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD}
      - MYSQL_DATABASE=${MISP_DB_NAME:-misp}
      - REDIS_HOST=misp-redis
      - REDIS_PASSWORD=${MISP_REDIS_PASSWORD}
      - PHP_MEMORY_LIMIT=${MISP_PHP_MEMORY_LIMIT:-2048M}
      - TZ=${TZ:-Europe/Paris}
    ports:
      - "${MISP_BIND_ADDR:-127.0.0.1}:${MISP_HTTPS_PORT:-8444}:443"
    volumes:
      - misp_config:/var/www/MISP/app/Config
      - misp_logs:/var/www/MISP/app/tmp/logs
      - misp_files:/var/www/MISP/app/files
      - misp_ssl:/etc/nginx/certs
      - misp_gnupg:/var/www/MISP/.gnupg
    healthcheck:
      test: ["CMD-SHELL", "curl -ks https://localhost/users/heartbeat > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - misp

  # Modules d'enrichissement MISP (expansion à la demande depuis l'UI :
  # whois, passive DNS, réputation...). Rien du pipeline automatique n'en
  # dépend — c'est un outil d'analyste.
  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:${MISP_MODULES_TAG:-v3.0.9}
    container_name: misp-modules
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Paris}
    mem_limit: 1g
    networks:
      - misp

  # Pont CTI : déclare les feeds dans MISP au démarrage (idempotent), puis
  # reconstruit toutes les heures le cache d'IOC lu par l'intégration
  # custom-misp du manager (cf. src/ai/soc_agent/cti.py).
  #
  # `|| true` sur le bootstrap : MISP met plusieurs minutes à finir ses
  # migrations au tout premier démarrage. Échouer là-dessus laisserait le
  # conteneur en boucle de redémarrage alors que la synchronisation suivante
  # aurait très bien fonctionné.
  soc-agent-cti:
    <<: *soc-agent
    container_name: soc-agent-cti
    depends_on:
      misp-core:
        condition: service_healthy
    volumes:
      - cti_ioc:/var/lib/aura-cti
    command: >
      sh -c "python -m soc_agent.cti --feeds || true;
             while true; do python -m soc_agent.cti; sleep 3600; done"

volumes:
  # Noms épinglés (`name:`) plutôt que laissés au préfixe de projet Compose
  # implicite : avant la fusion, chaque stack tournait dans son propre projet
  # (dossier ai/, iris/, shuffle/, wazuh/), donc ses volumes portaient déjà un
  # préfixe (wazuh_wazuh_etc, iris_iris_downloads...). Fusionner les 4 stacks
  # dans UN SEUL projet compose change le nom de projet et, sans ce `name:`
  # explicite, Docker recrée des volumes VIDES sous le nouveau préfixe —
  # perte silencieuse de toute donnée existante (config agents partagée,
  # téléchargements/templates IRIS, apps/fichiers Shuffle...). Les noms
  # ci-dessous sont ceux déjà utilisés en prod : aucune migration de données
  # requise pour ces volumes-là (contrairement aux 4 bases de données,
  # converties en bind mount vers ./db/).
  # --- Wazuh (hors bases de données, cf. ./db/) ---
  wazuh_api_configuration:
    name: wazuh_wazuh_api_configuration
  wazuh_etc:
    name: wazuh_wazuh_etc
  wazuh_logs:
    name: wazuh_wazuh_logs
  wazuh_queue:
    name: wazuh_wazuh_queue
  wazuh_var_multigroups:
    name: wazuh_wazuh_var_multigroups
  wazuh_integrations:
    name: wazuh_wazuh_integrations
  wazuh_active_response:
    name: wazuh_wazuh_active_response
  wazuh_agentless:
    name: wazuh_wazuh_agentless
  wazuh_wodles:
    name: wazuh_wazuh_wodles
  filebeat_etc:
    name: wazuh_filebeat_etc
  filebeat_var:
    name: wazuh_filebeat_var
  wazuh-dashboard-config:
    name: wazuh_wazuh-dashboard-config
  wazuh-dashboard-custom:
    name: wazuh_wazuh-dashboard-custom
  # --- IRIS (hors base de données) ---
  iris_downloads:
    name: iris_iris_downloads
  user_templates:
    name: iris_user_templates
  server_data:
    name: iris_server_data
  # --- Shuffle (hors OpenSearch) ---
  shuffle-apps:
    name: shuffle_shuffle-apps
  shuffle-files:
    name: shuffle_shuffle-files
  # --- MISP / CTI (hors base de données) ---
  misp_config:
    name: misp_config
  misp_logs:
    name: misp_logs
  misp_files:
    name: misp_files
  misp_ssl:
    name: misp_ssl
  misp_gnupg:
    name: misp_gnupg
  # Cache d'IOC : écrit par soc-agent-cti, monté en LECTURE SEULE sur le
  # manager. C'est le seul canal entre la CTI et la détection, et il est à sens
  # unique — le manager ne peut pas altérer le renseignement.
  cti_ioc:
    name: aura_cti_ioc

networks:
  # iris_frontend accueillera aussi le soc-agent : il parle à iris-app:8000
  # directement, sans repasser par nginx.
  iris_backend:
    name: iris_backend
  iris_frontend:
    name: iris_frontend
  shuffle:
    name: shuffle
    driver: bridge
  # MISP ne parle qu'à sa base et à son redis. Le soc-agent l'atteint par le
  # port publié sur la loopback (network_mode: host), pas par ce réseau.
  misp:
    name: misp
