<!DOCTYPE html>

<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4f6;   /* cool-smoke */
      --color-ink:     #10151f;   /* aura-night */
      --color-muted:   #4a5567;   /* aura-slate */
      --color-accent:  #ff2d3d;   /* aura-red */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1360px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>

    <p class="eyebrow">Architecture · AURA-SOC</p>
    <h1>AURA — XDR autonome, de l'alerte à la remédiation</h1>

    <svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aura-architecture-title aura-architecture-desc">

      <desc id="aura-architecture-desc">Les endpoints envoient leurs événements au Wazuh Manager, enrichi par les IOC de MISP ; les alertes partent dans l'indexer, où soc-agent les ingère, les corrèle et les fait trancher par l'API DeepSeek, puis ouvre un case DFIR-IRIS, repousse règles et exceptions vers le manager, et déclenche via Shuffle une remédiation qui redescend sur les endpoints ; PostgreSQL porte l'état, le dashboard Wazuh et le serveur MCP servent l'humain.</desc>

      <text x="800" y="265" fill="rgba(16,21,31,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECISION IA</text>

      <rect x="1016" y="168" width="248" height="284" rx="8" fill="rgba(16,21,31,0.02)" stroke="rgba(16,21,31,0.10)" stroke-width="0.8"/>
